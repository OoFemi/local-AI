version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: atlas-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secure_password
      MYSQL_DATABASE: atlas_ai
      MYSQL_USER: atlas_user
      MYSQL_PASSWORD: app_secure_password
    volumes:
      - atlas_db_data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - atlas-net

  atlas-app:
    build: .
    container_name: atlas-enterprise-app
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - DB_HOST=db
      - DB_USER=atlas_user
      - DB_PASS=app_secure_password
      - DB_NAME=atlas_ai
    depends_on:
      - db
    networks:
      - atlas-net

volumes:
  atlas_db_data:

networks:
  atlas-net:
    driver: bridge
